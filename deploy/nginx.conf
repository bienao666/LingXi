server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /api/plugin-oauth/callback {
        access_log off;
        error_log /dev/null crit;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $oauth_upstream core:8000;
        proxy_pass http://$oauth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        proxy_read_timeout 30s;
    }
    location ^~ /api/plugin-events/hooks/ {
        client_max_body_size 12k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $event_upstream core:8000;
        proxy_pass http://$event_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_read_timeout 30s;
    }
    location = /api/voice/realtime {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $voice_upstream core:8000;
        proxy_pass http://$voice_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $core_upstream core:8000;
        proxy_pass http://$core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /store/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $store_upstream plugin-store:8001;
        proxy_pass http://$store_upstream;
        proxy_set_header Host $host;
        proxy_set_header Cookie "lingxi_store_session=$cookie_lingxi_store_session";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
